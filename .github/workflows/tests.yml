name: Django CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Поднимаем сервисы — такие же, как в docker-compose!
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: questboard_test
          POSTGRES_USER: questboard
          POSTGRES_PASSWORD: questboard_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Забираем код проекта
        uses: actions/checkout@v4

      - name: Устанавливаем Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Устанавливаем зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Запускаем pytest
        env:
          # Django
          DJANGO_SETTINGS_MODULE: questboard.settings
          SECRET_KEY: "test-secret-key-for-ci-only"
          DEBUG: "True"
          # Postgres (сервис из services)
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: questboard_test
          DB_USER: questboard
          DB_PASSWORD: questboard_pass
          DB_HOST: localhost
          DB_PORT: "5432"
          # Redis (сервис из services)
          REDIS_HOST: localhost
        run: |
          pytest