{% extends 'base.html' %}

{% block title %}Новый квест — {{ board.title }}{% endblock %}

{% block content %}
    <h1>Новый квест для «{{ board.title }}»</h1>

    <form method="post" style="max-width: 600px;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Создать</button>
        <a href="{% url 'boards:board_detail' board.id %}" style="color: #888; margin-left: 15px;">Отмена</a>
    </form>
{% endblock %}
