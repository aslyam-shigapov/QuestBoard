{% extends 'base.html' %}

{% block title %}{{ action }} доску{% endblock %}

{% block content %}
    <h1>{{ action }} доску</h1>

    <form method="post" enctype="multipart/form-data" style="max-width: 600px;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">{{ action }}</button>
        <a href="{% url 'boards:board_list' %}" style="color: #888; margin-left: 15px;">Отмена</a>
    </form>
{% endblock %}
