{% extends 'base.html' %}

{% block title %}Удалить доску — QuestBoard{% endblock %}

{% block content %}
    <h1>Удалить доску?</h1>
    <p>Вы уверены, что хотите удалить <strong>{{ board.title }}</strong>? Это действие нельзя отменить.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn" style="background: #7f1d1d;">Да, удалить</button>
        <a href="{% url 'boards:board_detail' board.id %}" style="color: #888; margin-left: 15px;">Отмена</a>
    </form>
{% endblock %}
