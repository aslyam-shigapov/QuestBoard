{% extends 'base.html' %}

{% block title %}Регистрация — QuestBoard{% endblock %}

{% block content %}
    <h1>Регистрация</h1>

    <form method="post" style="max-width: 400px;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Создать аккаунт</button>
    </form>

    <p style="margin-top: 20px;">
        Уже есть аккаунт?
        <a href="{% url 'users:login' %}" style="color: #a78bfa;">Войти</a>
    </p>
{% endblock %}
