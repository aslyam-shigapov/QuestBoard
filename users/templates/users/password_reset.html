{% extends 'base.html' %}

{% block title %}Сброс пароля — QuestBoard{% endblock %}

{% block content %}
    <h1>Сброс пароля</h1>
    <p>Введите email, указанный при регистрации. Мы отправим ссылку для сброса.</p>

    <form method="post" style="max-width: 400px;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Отправить письмо</button>
    </form>

    <p style="margin-top: 20px;">
        <a href="{% url 'users:login' %}" style="color: #a78bfa;">← Вернуться ко входу</a>
    </p>
{% endblock %}
