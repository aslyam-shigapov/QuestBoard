{% extends 'base.html' %}

{% block title %}Вход — QuestBoard{% endblock %}

{% block content %}
    <h1>Вход</h1>

    <form method="post" style="max-width: 400px;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Войти</button>
    </form>

    <p style="margin-top: 20px;">
        Нет аккаунта?
        <a href="{% url 'users:register' %}" style="color: #a78bfa;">Зарегистрироваться</a>
    </p>
{% endblock %}
