{% extends 'base.html' %}
{% load socialaccount %}

{% block title %}Вход — QuestBoard{% endblock %}

{% block content %}
    <h1>Вход</h1>

    <form method="post" style="max-width: 400px;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Войти</button>
    </form>

    <p style="margin-top: 15px; font-size: 14px;">
        <a href="{% url 'users:password_reset' %}">Забыли пароль?</a>
    </p>

    <div class="auth-divider">
        <span>или войдите через</span>
    </div>

    <div style="max-width: 400px;">
        <a href="{% provider_login_url 'yandex' %}" class="social-btn social-yandex">
            <span class="social-icon">🔴</span>
            <span>Войти через Яндекс</span>
        </a>

        <a href="{% provider_login_url 'github' %}" class="social-btn social-github">
            <span class="social-icon">🐙</span>
            <span>Войти через GitHub</span>
        </a>
    </div>

    <p style="margin-top: 24px;">
        Нет аккаунта?
        <a href="{% url 'users:register' %}">Зарегистрироваться</a>
    </p>
{% endblock %}
