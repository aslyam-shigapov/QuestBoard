{% extends 'base.html' %}

{% block title %}Новый пароль — QuestBoard{% endblock %}

{% block content %}
    <h1>Новый пароль</h1>

    {% if validlink %}
        <form method="post" style="max-width: 400px;">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Сохранить пароль</button>
        </form>
    {% else %}
        <p style="color: #fca5a5;">Ссылка недействительна или устарела. Запросите сброс снова.</p>
        <a href="{% url 'users:password_reset' %}" class="btn">Запросить снова</a>
    {% endif %}
{% endblock %}
